name: Bug report
description: Report a defect in the Maven plugin
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in the
        sections below so the issue can be reproduced and triaged quickly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
      placeholder: When running `mvn ... generate`, the plugin behaves wrong because Z.
    validations:
      required: true

  - type: textarea
    id: plugin-configuration
    attributes:
      label: Plugin configuration
      description: The `<plugin>` block from your `pom.xml`, including `<formats>` and any other configuration.
      render: xml
    validations:
      required: true

  - type: textarea
    id: openapi-input
    attributes:
      label: OpenAPI input
      description: |
        The OpenAPI specification that triggers the bug, ideally a minimal
        reduction. Paste it inline as YAML/JSON, or link to a gist.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect the plugin to produce?
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version / commit
      description: Version of `openapi-collection-generator-maven-plugin` (or commit hash if built from source).
      placeholder: "1.0.0-SNAPSHOT @ abcdef0"
    validations:
      required: true

  - type: input
    id: maven-version
    attributes:
      label: Maven version
      placeholder: "e.g. 3.9.9"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "e.g. 17.0.12 (Temurin)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Maven output / stack trace
      description: Run with `mvn -X` and paste the relevant excerpt.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and could not find a duplicate.
          required: true
        - label: My report follows the [Code of Conduct](../CODE_OF_CONDUCT.md).
          required: true